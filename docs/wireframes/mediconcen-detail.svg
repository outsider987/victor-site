<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mediconcen case-study modal wireframe</title>
  <desc id="desc">An editorial one-section layout showing one verified clinic visit in three product states and a compact supporting system architecture.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10z" fill="#169b6b"/>
    </marker>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      .ink{fill:#121514}.muted{fill:#656a67}.green{fill:#169b6b}.hair{stroke:#b9bbb5;stroke-width:1;fill:none}
      .flow{stroke:#169b6b;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .ui{fill:#fbfbf7;stroke:#b9bbb5;stroke-width:1}.ui-line{stroke:#c9cbc5;stroke-width:1}.ui-dark{fill:#202421}.ui-green{fill:#169b6b}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#080909"/>
  <rect x="70" y="44" width="1460" height="912" fill="#efeee8"/>

  <g class="sans">
    <text x="116" y="88" class="muted" font-size="13" letter-spacing="1.4">02 / 04 · CLINIC CARE OPERATIONS</text>
    <text x="1462" y="88" class="ink" font-size="15" text-anchor="end">Close ×</text>
    <line x1="116" y1="108" x2="1484" y2="108" class="hair"/>

    <text x="116" y="190" class="ink" font-size="72" font-weight="700" letter-spacing="-4">MEDICONCEN</text>
    <text x="116" y="231" class="ink" font-size="22">One verified visit, from eligibility to record.</text>
    <text x="116" y="260" class="muted" font-size="17">從資格驗證、診所待辦，到完成後的營運紀錄。</text>
    <text x="1484" y="186" class="green" font-size="16" text-anchor="end">ONE VERIFIED VISIT</text>
    <text x="1484" y="215" class="muted" font-size="15" text-anchor="end">Product flow above · system context below</text>

    <line x1="116" y1="290" x2="1484" y2="290" class="hair"/>

    <text x="116" y="332" class="green mono" font-size="14">01</text>
    <text x="148" y="332" class="ink" font-size="23" font-weight="600">Verify eligibility</text>
    <text x="508" y="332" class="green mono" font-size="14">02</text>
    <text x="540" y="332" class="ink" font-size="23" font-weight="600">Run the visit</text>
    <text x="1190" y="332" class="green mono" font-size="14">03</text>
    <text x="1222" y="332" class="ink" font-size="23" font-weight="600">Complete the record</text>

    <!-- Verify product crop -->
    <rect x="116" y="358" width="330" height="280" class="ui"/>
    <rect x="116" y="358" width="330" height="34" class="ui-dark"/>
    <circle cx="135" cy="375" r="4" class="ui-green"/>
    <text x="150" y="380" fill="#ffffff" font-size="12">Visit verification</text>
    <text x="139" y="427" class="muted" font-size="12">Payer and service</text>
    <rect x="139" y="440" width="284" height="38" fill="#efeee8"/>
    <text x="153" y="464" class="ink" font-size="13">Select configured service</text>
    <text x="139" y="510" class="muted" font-size="12">Membership check</text>
    <rect x="139" y="523" width="284" height="54" fill="#efeee8"/>
    <rect x="139" y="594" width="122" height="26" class="ui-green"/>
    <text x="200" y="612" fill="#ffffff" font-size="12" text-anchor="middle">Verify</text>

    <!-- Main care workspace -->
    <rect x="508" y="358" width="636" height="300" class="ui"/>
    <rect x="508" y="358" width="636" height="42" class="ui-dark"/>
    <circle cx="530" cy="379" r="5" class="ui-green"/>
    <text x="547" y="384" fill="#ffffff" font-size="13">Clinic work queue · verified visit</text>
    <rect x="532" y="426" width="188" height="206" fill="#e5e5de"/>
    <text x="552" y="458" class="ink" font-size="14" font-weight="600">Visit summary</text>
    <line x1="552" y1="479" x2="696" y2="479" class="ui-line"/>
    <line x1="552" y1="507" x2="672" y2="507" class="ui-line"/>
    <line x1="552" y1="535" x2="688" y2="535" class="ui-line"/>
    <text x="752" y="450" class="muted" font-size="12">CARE WORKSPACE</text>
    <text x="752" y="484" class="ink" font-size="18" font-weight="600">Diagnosis and medicine</text>
    <rect x="752" y="508" width="354" height="44" fill="#efeee8"/>
    <rect x="752" y="564" width="354" height="44" fill="#efeee8"/>
    <rect x="752" y="612" width="154" height="28" class="ui-green"/>
    <text x="829" y="631" fill="#ffffff" font-size="12" text-anchor="middle">Review visit</text>

    <!-- Completed record product crop -->
    <rect x="1190" y="358" width="294" height="280" class="ui"/>
    <rect x="1190" y="358" width="294" height="34" class="ui-dark"/>
    <text x="1211" y="380" fill="#ffffff" font-size="12">Completed record</text>
    <text x="1214" y="431" class="green" font-size="13">COMPLETED</text>
    <text x="1214" y="466" class="ink" font-size="17" font-weight="600">Operational record</text>
    <line x1="1214" y1="493" x2="1458" y2="493" class="ui-line"/>
    <line x1="1214" y1="524" x2="1432" y2="524" class="ui-line"/>
    <line x1="1214" y1="555" x2="1447" y2="555" class="ui-line"/>
    <text x="1214" y="604" class="muted" font-size="12">Available to records and reporting</text>

    <path d="M446 493 H492" class="flow"/>
    <text x="469" y="475" class="green" font-size="13" text-anchor="middle">creates work item</text>
    <path d="M1144 533 H1174" class="flow"/>
    <text x="1159" y="515" class="green" font-size="13" text-anchor="middle">settles</text>

    <text x="116" y="687" class="ink" font-size="18" font-weight="600">Successful verification creates a trackable clinic work item.</text>
    <text x="116" y="714" class="muted" font-size="16">Settlement moves the completed visit into records and reporting.</text>

    <line x1="116" y1="752" x2="1484" y2="752" class="hair"/>
    <text x="116" y="790" class="green mono" font-size="13">SYSTEM BEHIND THE FLOW</text>

    <!-- Compact context/backbone -->
    <text x="116" y="853" class="ink" font-size="18" font-weight="600">Clinic staff</text>
    <path d="M220 847 H292" class="flow"/>
    <text x="256" y="828" class="muted" font-size="13" text-anchor="middle">uses</text>

    <rect x="308" y="816" width="232" height="62" fill="#ffffff" stroke="#121514" stroke-width="1"/>
    <text x="424" y="843" class="ink" font-size="18" font-weight="600" text-anchor="middle">Next.js portal</text>
    <text x="424" y="865" class="muted" font-size="13" text-anchor="middle">Verify · work queue · records</text>
    <path d="M540 847 H632" class="flow"/>
    <text x="586" y="828" class="muted" font-size="13" text-anchor="middle">requests</text>

    <rect x="648" y="816" width="222" height="62" fill="#121514"/>
    <text x="759" y="843" fill="#ffffff" font-size="18" font-weight="600" text-anchor="middle">NestJS API</text>
    <text x="759" y="865" fill="#bfc4c1" font-size="13" text-anchor="middle">orchestrates · Redis cache</text>
    <path d="M870 836 C922 836 922 805 962 805" class="flow"/>
    <text x="918" y="797" class="muted" font-size="13" text-anchor="middle">persists</text>
    <rect x="978" y="780" width="220" height="50" fill="#ffffff" stroke="#121514" stroke-width="1"/>
    <text x="1088" y="812" class="ink" font-size="18" font-weight="600" text-anchor="middle">MySQL</text>

    <path d="M870 858 C922 858 922 879 962 879" class="flow"/>
    <text x="916" y="891" class="muted" font-size="13" text-anchor="end">verifies / settles</text>
    <rect x="978" y="854" width="350" height="50" fill="#ffffff" stroke="#121514" stroke-width="1"/>
    <text x="1153" y="875" class="ink" font-size="16" font-weight="600" text-anchor="middle">Eligibility · payment services</text>
    <text x="1153" y="894" class="muted" font-size="12" text-anchor="middle">External systems</text>

    <line x1="116" y1="920" x2="1484" y2="920" class="hair"/>
    <text x="116" y="943" class="muted mono" font-size="12">NEXT.JS · TYPESCRIPT · NESTJS · MYSQL · REDIS</text>
    <text x="1484" y="943" class="muted mono" font-size="12" text-anchor="end">SIMPLIFIED ARCHITECTURE · FICTIONAL DATA · PARTNER RULES OMITTED</text>
  </g>
</svg>
